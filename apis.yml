aid: super-seguros
name: Super Seguros
description: >-
  Super Seguros (super.mx) is a Mexican insurtech that lets people quote, buy, and
  manage insurance entirely online. Its developer product, Super Studio, is a set of
  REST APIs partners use to generate insurance quotes and sell policies — covering life
  insurance (12-month term and 5-year plans with savings), home, renters, and landlord
  products. Quoting endpoints are broadly available and return prefilled purchase links
  to super.mx; purchase endpoints let approved partners sell insurance directly via API.
  Authentication is via an X-Api-Key header, with separate sandbox and production hosts.
  Super Seguros is backed by Anthemis.
